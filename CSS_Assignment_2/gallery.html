<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Gallery</title>
    <link href="style.css" rel="stylesheet" />

    <!--Google Fonts-->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bilbo+Swash+Caps&family=Metamorphous&family=Pinyon+Script&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <header>
      <h1>Lila Art Gallery</h1>
      <nav class="navbar">
        <ul>
          <li><a href="index.html">About the Exhibition</a></li>
          <li><a href="gallery.html" aria-current="page">Gallery</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <div id="flower-collection" class="flower-collection">
        <h2>Garden in a Jar Collection</h2>
        <img
          src="/images/Flowers-in-a-vase.jpg"
          class="flowers"
          id="flower1"
          alt="Flowers in a vase"
        />
        <img
          src="/images/Boquet-de-fleurs.jpg"
          class="flowers"
          id="flower2"
          alt="Flower Bouquet"
        />
        <img
          src="/images/Bouquet-of-flowers.jpg"
          class="flowers"
          id="flower3"
          alt="Bouquet of flowers"
        />
      </div>

      <div class="jungle-collection">
        <h2>The Jungle Collection</h2>
        <img
          src="/images/attacked-by-a-tiger.jpg"
          id="tigger-attack"
          alt="Animal attacked by a tiger"
        />
        <img
          src="/images/Fight-between-a-tiger-and-a-buffalo.jpg"
          id="buffalo"
          alt="Buffalo hunted by a tiger"
        />
        <br />
        <img
          src="/images/Tropical-forest-with-monkeys.jpg"
          id="monkeys"
          alt="Monkeys in the jungle"
        />
        <br />
        <img
          src="/images/the-snake-charmer.jpg"
          id="snake-charmer"
          alt="A snake charmer in the jungle"
        />
      </div>

      <div id="portrait-collection" class="portrait-collection">
        <h2>Portraits Collection</h2>
        <img
          src="/images/child-with-a-doll.jpg"
          class="portrait"
          alt="Child with doll"
        />
        <img
          src="/images/Portrait-de-femme-au-bouquet-de-fleurs.jpg"
          class="portrait"
          alt="Woman"
        />
        <img
          src="/images/woman-with-a-basket-of-eggs.jpg"
          class="portrait"
          alt="Woman with basket"
        />
      </div>

      <div id="town-collection" class="town-society">
        <h2>Town Views Collection</h2>
        <img
          src="/images/La-Seine-a-Suresnesl.jpg"
          class="town"
          alt="Night view"
        />
        <img
          src="/images/Pont-de-Sevres.jpg"
          class="town"
          alt="Boats in a river"
        />
        <img src="/images/the-laundry-boat.jpg" class="town" alt="Big boat" />
        <img src="/images/toll-gate.jpg" class="town" alt="Gate" />
      </div>

      <div id="society-collection" class="town-society">
        <h2>The Society Collection</h2>
        <img
          src="images/the-family.jpg"
          alt="Family picture"
          class="family-pic"
        />
        <img
          src="images/the-muse-inspiring-the-poet.jpg"
          alt="A couple"
          class="family-pic"
        />
        <img src="/images/the-wedding-party.jpg" alt="Wedding party" />
      </div>

      <a href="/review.html" target="blank">
        <img src="/images/review.jpg" alt="Review" />
      </a>
    </main>

    <footer>
      <p>
        Want to get in touch? We'd love to hear from you! <br />
        contact@lilagallery.com <br />
        ©2025 Rawpixel Ltd.
      </p>
    </footer>
  </body>
</html>
